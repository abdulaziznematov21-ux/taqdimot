<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tashkilotchi Haida</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0806] text-white font-sans min-h-screen p-6">

    <div class="max-w-3xl mx-auto my-10 bg-[#14100c] border border-[#2b2218] rounded-3xl p-8 shadow-2xl relative" id="details-container">
        <!-- Ma'lumotlar JS orqali bu yerga joylashadi -->
    </div>

    <script>
        // 1. localStorage-dan tanlangan tashkilotchi ma'lumotini olamiz
        const storedOrganizer = localStorage.getItem("selectedOrganizer");
        const container = document.getElementById("details-container");

        if (storedOrganizer) {
            const org = JSON.parse(storedOrganizer);

            // Teglar ro'yxatini shakllantirish
            const tagsHTML = org.tags.map(tag => 
                `<span class="px-3 py-1 bg-[#231b13] border border-[#735114]/40 text-[#edd38d] text-xs rounded-full">${tag}</span>`
            ).join('');

            container.innerHTML = `
                <a href="javascript:history.back()" class="inline-block mb-6 text-xs font-bold uppercase tracking-widest text-[#dca842] hover:underline">
                    ← Orqaga qaytish
                </a>

                <div class="flex flex-col sm:flex-row items-center gap-6">
                    <div class="w-32 h-32 rounded-full p-1 bg-gradient-to-b from-[#dca842] via-[#735114] to-[#2b2218] flex-shrink-0">
                        <img src="${org.img}" alt="${org.name}" class="w-full h-full rounded-full object-cover border-4 border-[#14100c]">
                    </div>

                    <div class="text-center sm:text-left">
                        <div class="flex items-center justify-center sm:justify-start gap-2">
                            <h1 class="text-2xl sm:text-3xl font-serif text-[#edd38d] font-bold">${org.name}</h1>
                            ${org.verified ? '<span class="text-blue-400 text-lg" title="Tasdiqlangan">✓</span>' : ''}
                        </div>
                        <p class="text-sm text-[#a39582] mt-1">${org.eventsCount} • <span class="text-yellow-400">${org.rating}</span></p>
                        
                        <div class="flex flex-wrap justify-center sm:justify-start gap-2 mt-4">
                            ${tagsHTML}
                        </div>
                    </div>
                </div>

                <hr class="border-[#2b2218] my-6">

                <div>
                    <h3 class="text-lg font-serif text-[#edd38d] mb-2">Tashkilotchi haqida:</h3>
                    <p class="text-[#a39582] text-sm leading-relaxed">${org.desc}</p>
                </div>
            `;
        } else {
            container.innerHTML = `
                <p class="text-center text-red-400">Tashkilotchi ma'lumotlari topilmadi!</p>
                <div class="text-center mt-4">
                    <a href="./index.html" class="text-[#dca842] underline">Bosh sahifaga qaytish</a>
                </div>
            `;
        }
    </script>
</body>
</html>
