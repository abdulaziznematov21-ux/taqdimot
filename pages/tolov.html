<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To'lov - Modal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Playfair Display va Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070707;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }
    
    /* Oltin rangli gradient uslublari */
    .bg-gold-gradient {
      background: linear-gradient(135deg, #fae298 0%, #dfb559 50%, #b28836 100%);
    }
    .text-gold-gradient {
      background: linear-gradient(135deg, #fce08f 0%, #e2b95d 50%, #ba9243 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Custom Switch / Radio stili */
    .toggle-checkbox:checked {
      right: 0;
      background-color: #ffffff;
    }
    .toggle-checkbox:checked + .toggle-label {
      background: linear-gradient(135deg, #fae298 0%, #dfb559 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-200 select-none">

  <!-- MODAL CONTAINER -->
  <div id="paymentModal" class="w-full max-w-[480px] bg-[#14120f] border border-[#2b261e] rounded-3xl p-6 sm:p-8 shadow-2xl relative transition-all duration-300">
    
    <!-- HEDER: SARLAVHA VA YOPISH TUGMASI -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="font-serif-title text-2xl tracking-wide text-gold-gradient font-semibold">TO'LOV</h2>
      <button id="closeModalBtn" class="w-8 h-8 rounded-full border border-[#383227] bg-[#1a1814] flex items-center justify-center text-gray-400 hover:text-white hover:border-gray-500 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- TABS: TO'LOV USULLARI -->
    <div class="bg-[#1b1915] p-1 rounded-full flex items-center justify-between mb-5 border border-[#28241d]">
      <button onclick="switchTab('karta')" id="tab-karta" class="tab-btn flex-1 py-2 rounded-full text-xs font-semibold transition-all duration-200 bg-gold-gradient text-black shadow-md">
        Karta
      </button>
      <button onclick="switchTab('payme')" id="tab-payme" class="tab-btn flex-1 py-2 rounded-full text-xs font-medium text-gray-400 hover:text-gray-200 transition-all duration-200">
        Payme
      </button>
      <button onclick="switchTab('click')" id="tab-click" class="tab-btn flex-1 py-2 rounded-full text-xs font-medium text-gray-400 hover:text-gray-200 transition-all duration-200">
        Click
      </button>
      <button onclick="switchTab('muddatli')" id="tab-muddatli" class="tab-btn flex-1 py-2 rounded-full text-xs font-medium text-gray-400 hover:text-gray-200 transition-all duration-200">
        Muddatli
      </button>
    </div>

    <!-- TAB 1: KARTA ORQALI TO'LOV CONTENT -->
    <div id="content-karta" class="space-y-4">
      
      <!-- SAQLANGAN KARTA PANELI -->
      <div id="savedCardBox" class="bg-[#191713] border border-[#2d281f] rounded-2xl p-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <!-- Radio icon -->
          <div id="savedCardRadio" class="w-4 h-4 rounded-full border-2 border-[#dfb559] flex items-center justify-center cursor-pointer">
            <div class="w-2 h-2 rounded-full bg-[#dfb559]"></div>
          </div>
          <span class="text-xs text-[#b8ab95] tracking-widest font-medium">
            &bull;&bull;&bull;&bull; 4242 &bull; Uzcard &bull; 09/27
          </span>
        </div>
        <button id="toggleNewCardBtn" class="text-xs text-[#e0b75a] font-semibold hover:underline">
          + Yangi karta
        </button>
      </div>

      <!-- KARTA FORMASI -->
      <form id="cardForm" class="space-y-4">
        
        <!-- Karta Raqami -->
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-[#8c8273] font-semibold mb-1.5">
            KARTA RAQAMI
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="cardNumber" 
              placeholder="0000 0000 0000 0000" 
              maxlength="19"
              class="w-full bg-[#171512] border border-[#2b261e] rounded-xl px-4 py-3 text-sm text-[#e6dcce] placeholder-[#403a31] focus:outline-none focus:border-[#dfb559] transition-colors tracking-widest"
            />
            <span id="cardBadge" class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-bold tracking-wider text-[#dfb559] uppercase">
              UZCARD
            </span>
          </div>
        </div>

        <!-- Muddat va CVV -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-[#8c8273] font-semibold mb-1.5">
              AMAL QILISH MUDDATI
            </label>
            <input 
              type="text" 
              id="cardExpiry" 
              placeholder="MM/YY" 
              maxlength="5"
              class="w-full bg-[#171512] border border-[#2b261e] rounded-xl px-4 py-3 text-sm text-[#e6dcce] placeholder-[#403a31] focus:outline-none focus:border-[#dfb559] transition-colors tracking-widest"
            />
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-[#8c8273] font-semibold mb-1.5">
              CVV
            </label>
            <input 
              type="password" 
              id="cardCvv" 
              placeholder="&bull;&bull;&bull;" 
              maxlength="3"
              class="w-full bg-[#171512] border border-[#2b261e] rounded-xl px-4 py-3 text-sm text-[#e6dcce] placeholder-[#403a31] focus:outline-none focus:border-[#dfb559] transition-colors tracking-widest"
            />
          </div>
        </div>

        <!-- Karta Egasi -->
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-[#8c8273] font-semibold mb-1.5">
            KARTA EGASI
          </label>
          <input 
            type="text" 
            id="cardHolder" 
            placeholder="ISM SHARIF" 
            class="w-full bg-[#171512] border border-[#2b261e] rounded-xl px-4 py-3 text-sm text-[#e6dcce] placeholder-[#403a31] focus:outline-none focus:border-[#dfb559] transition-colors uppercase tracking-wider"
          />
        </div>

        <!-- TOGGLE: KARTANI SAQLASH -->
        <div class="flex items-center gap-3 pt-1">
          <label class="relative inline-block w-11 h-6 align-middle select-none cursor-pointer">
            <input type="checkbox" id="saveCardToggle" checked class="sr-only peer">
            <div class="w-11 h-6 bg-[#25221b] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-gradient-to-r peer-checked:from-[#fae298] peer-checked:to-[#dfb559]"></div>
          </label>
          <span class="text-xs text-[#c4b7a2] font-medium">Kartani saqlash</span>
        </div>

      </form>
    </div>

    <!-- BOSHQATAN PAYME / CLICK MUDDATLI UCHUN PANEL -->
    <div id="content-payme" class="hidden py-8 text-center text-xs text-gray-400">
      Payme ilovasi orqali to'lovni davom ettirish uchun tayyor.
    </div>
    <div id="content-click" class="hidden py-8 text-center text-xs text-gray-400">
      Click Evolution orqali tezkor to'lov.
    </div>
    <div id="content-muddatli" class="hidden py-8 text-center text-xs text-gray-400">
      Bo'lib to'lash xizmati bo'yicha shartlar.
    </div>

    <!-- PASTA AJRATUVCHI CHIZIQ VA DOTS -->
    <div class="my-6 relative flex items-center justify-center">
      <div class="w-full h-[1px] bg-[#29241c]"></div>
      <div class="absolute left-0 w-2.5 h-2.5 rounded-full bg-[#1d1a15] border border-[#3b3427]"></div>
      <div class="absolute right-0 w-2.5 h-2.5 rounded-full bg-[#1d1a15] border border-[#3b3427]"></div>
    </div>

    <!-- TADBIR HAQIDA MA'LUMOT (FOOTER) -->
    <div class="flex items-center justify-between">
      <div>
        <h3 class="font-serif-title text-lg text-[#f0e3ce] font-medium leading-tight">Yulduzli kecha</h3>
        <p class="text-xs text-[#827869] mt-0.5">2 &times; Premium &bull; Sektor B, Qator 4</p>
      </div>

      <a href="./chek.html" id="paySubmitBtn" class="px-5 py-2.5 rounded-xl bg-gold-gradient text-black font-semibold text-xs hover:brightness-110 active:scale-95 transition-all shadow-md">
        To'lash
      </a>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIKASI -->
  <script>
    // 1. TABS UCHUN INTERAKTIVLIK
    function switchTab(tabName) {
      // Barcha kontentlarni yashirish
      ['karta', 'payme', 'click', 'muddatli'].forEach(t => {
        document.getElementById(`content-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-${t}`);
        btn.className = 'tab-btn flex-1 py-2 rounded-full text-xs font-medium text-gray-400 hover:text-gray-200 transition-all duration-200';
      });

      // Aktiv tabni ko'rsatish
      document.getElementById(`content-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tabName}`);
      activeBtn.className = 'tab-btn flex-1 py-2 rounded-full text-xs font-semibold transition-all duration-200 bg-gold-gradient text-black shadow-md';
    }

    // 2. KARTA INPUTLARINI MASKALASH VA FORMATLASH
    const cardNumberInput = document.getElementById('cardNumber');
    const cardExpiryInput = document.getElementById('cardExpiry');
    const cardBadge = document.getElementById('cardBadge');

    // Karta raqamini har 4 xonadan keyin bo'shliq qo'shish & Turlarini aniqlash
    cardNumberInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, ''); // faqat raqamlar
      let formatted = '';
      for (let i = 0; i < value.length; i++) {
        if (i > 0 && i % 4 === 0) formatted += ' ';
        formatted += value[i];
      }
      e.target.value = formatted;

      // Avtomatik Uzcard / Humo / Visa badge belgilash
      if (value.startsWith('8600')) {
        cardBadge.textContent = 'UZCARD';
      } else if (value.startsWith('9860')) {
        cardBadge.textContent = 'HUMO';
      } else if (value.startsWith('4')) {
        cardBadge.textContent = 'VISA';
      } else if (value.startsWith('5')) {
        cardBadge.textContent = 'MASTER';
      } else {
        cardBadge.textContent = 'UZCARD';
      }
    });

    // Amal qilish muddatini MM/YY shaklida formatlash
    cardExpiryInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length >= 2) {
        e.target.value = value.slice(0, 2) + '/' + value.slice(2, 4);
      } else {
        e.target.value = value;
      }
    });

    // 3. SAQLANGAN KARTA VA YANGI KARTA O'RTASIDA ALMASHTIRISH
    const toggleNewCardBtn = document.getElementById('toggleNewCardBtn');
    const cardForm = document.getElementById('cardForm');
    let isNewCardOpen = true;

    toggleNewCardBtn.addEventListener('click', () => {
      isNewCardOpen = !isNewCardOpen;
      if (isNewCardOpen) {
        cardForm.classList.remove('opacity-40', 'pointer-events-none');
        toggleNewCardBtn.textContent = '+ Yangi karta';
      } else {
        cardForm.classList.add('opacity-40', 'pointer-events-none');
        toggleNewCardBtn.textContent = 'Tanlandi';
      }
    });

    // 4. MODALNI YOPISH
    document.getElementById('closeModalBtn').addEventListener('click', () => {
      const modal = document.getElementById('paymentModal');
      modal.style.opacity = '0';
      modal.style.transform = 'scale(0.95)';
      setTimeout(() => {
        alert("To'lov modali yopildi.");
        modal.style.opacity = '1';
        modal.style.transform = 'scale(1)';
      }, 300);
    });

    // 5. TO'LASH TUGMASI ACTION
    document.getElementById('paySubmitBtn').addEventListener('click', () => {
      alert("To'lov muvaffaqiyatli amalga oshirildi!");
    });
  </script>
</body>
</html>
